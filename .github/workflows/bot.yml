name: Telegram Bot Runner

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install dependencies
        run: |
          npm install
          
      - name: Create JSON files
        run: |
          echo '[]' > banlist.json
          echo '[]' > logs.json
          echo '{}' > idlist.json
          echo '{}' > keys.json
          echo '{}' > settings.json
          
      - name: Run Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: |
          npm start
